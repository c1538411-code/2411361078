<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        img {
            display: inline;
            width: 300px;
            position: absolute;
            top: 20px;
            left: 300px;
        }

        p {
            display: block;
            width: 300px;
            white-space: pre-line;
        }

        /* 新增：relative 的小註解 */
        span {
            display: inline;
        }
        .note {
            position: relative;   /* 相對定位 */
            top: 5px;             /* 往下移 5px */
            font-size: 12px;
            color: blue;
        }
    </style>
</head>
<body>
    <img src="bg5.jpg">

    <h1>小星星</h1>
    <p>
一閃一閃亮晶晶
滿天都是小星星<span class="note">
掛在天上放光明
好像許多小眼睛
一閃一閃亮晶晶
滿天都是小星星
    </p>

    <h1>造飛機</h1>
    <p>
造飛機
造飛機
來到青草地
蹲下來
蹲下來
我做推進器
蹲下去
蹲下去
我做機艙翼
飛呀飛
飛呀飛
飛到自雲裡
    </p>
</body>
</html>
