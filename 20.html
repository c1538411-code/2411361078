<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        p {
            display: block;
            font-size: 15px;
            line-height: 2;
        }
        span {
            display: inline;
        }

        /* 1. static：預設定位，照正常文件流程排 */
        .note-static {
            position: static;
            font-size: 12px;
            color: red;
        }

        /* 2. relative：相對原本位置微調 */
        .note-relative {
            position: relative;
            top: 5px;
            font-size: 12px;
            color: blue;
        }

        /* 3. absolute：相對最近的「有定位」父元素 */
        .box {
            position: relative;      /* 給 absolute 用來對齊的外框 */
            border: 1px solid #999;
            padding: 10px;
            margin-top: 10px;
        }
        .note-absolute {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
            color: green;
        }

        /* 4. fixed：固定在視窗位置 */
        .note-fixed {
            position: fixed;
            right: 10px;
            bottom: 10px;
            font-size: 12px;
            color: purple;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <!-- static 範例 -->
    <p>
        青山橫北郭，白水繞東城。此地一為別，孤蓬萬里征。
        <span class="note-static">注釋：「郭」意指城外（static）</span>
    </p>

    <!-- relative 範例（就是你原本那個） -->
    <p>
        浮雲游子意，落日故人情。揮手自茲去，蕭蕭班馬鳴。
        <span class="note-relative">注釋：「茲」意指現在（relative，下移 5px）</span>
    </p>

    <!-- absolute 範例 -->
    <div class="box">
        <p>這一段文字放在有邊框的區塊裡，註解會固定在右上角。</p>
        <span class="note-absolute">我是 absolute，定位在這個框的右上角</span>
    </div>

    <!-- fixed 範例 -->
    <p>往下捲動頁面時，右下角會一直看到 fixed 的小註解。</p>
    <span class="note-fixed">我是 fixed，固定在視窗右下角</span>

</body>
</html>
