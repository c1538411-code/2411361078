<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>方框打勾示範</title>
    <style>
        body {
            font-family: "微軟正黑體", system-ui, sans-serif;
            background-color: #faedcd;   /* 淡米色背景，接近你的截圖 */
        }

        h1 {
            text-align: center;
            margin-top: 24px;
        }

        table {
            border-collapse: collapse;
            margin: 24px auto;
            background-color: #faedcd;
        }

        th, td {
            border: 1px solid #000;
            width: 60px;
            height: 40px;
            text-align: center;
        }

        /* 客製化紅色方框核取方塊 */
        label.checkbox {
            position: relative;
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #e76f51; /* 紅橘色外框 */
            box-sizing: border-box;
            cursor: pointer;
        }

        /* 真正的 checkbox 隱藏，但還是可點擊 */
        label.checkbox input {
            position: absolute;
            inset: 0;
            opacity: 0;
            margin: 0;
            cursor: pointer;
        }

        /* 內部用 span 來畫勾勾 */
        label.checkbox span {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 有勾選時顯示 ✔ */
        label.checkbox input:checked + span::after {
            content: "✔";
            position: absolute;
            left: 1px;
            top: -4px;
            font-size: 18px;
            color: #e76f51;
        }
    </style>
</head>
<body>
    <h1>方框打勾表格示範</h1>

    <table>
        <tbody>
            <!-- 想多幾列就複製 tr 這一行 -->
            <tr>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
            </tr>
            <tr>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
            </tr>
            <tr>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
                <td><label class="checkbox"><input type="checkbox"><span></span></label></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
