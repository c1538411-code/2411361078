<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>我的網頁</title>
        <style>
        .odd {background:lightyellow;}  /*類別選擇器.odd */
        .even {background: lightpink;}  /*類別選擇器.even*/
        </style>
    </head>
    <body>
        <table>
            <tr class="odd"><td>01</td><td>小丸子</td></tr>
            <tr class="even"><td>02</td><td>小玉</td></tr>
            <tr class="odd"><td>03</td><td>花輪</td></tr>
            <tr class="even"><td>04</td><td>丸尾</td></tr>
        </table>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>我的網頁</title>
        <style>
           [class |="coffee"] {color:blue;}   /*屬性選擇器*/
        </style>
    </head>
    <body>
        <ul>
            <li class="coffee">精選咖啡</li>
            <li class="coffee-vanilla">香草拿鐵</li>
            <li class="coffee au lait">咖啡歐雷</li>
            <li class="Irish coffee">愛爾蘭咖啡</li>
            <li class="Vienna coffee">維也納咖啡</li>
        </ul>
    </body>
</html>
<!DOCTYPE html>
<html>
    <head>
        <style>
            h1 {color: blue;}
            p {color: red;}
            ul > li {color: red;}
        section>p>a{color: red;}
        </style>
    </head>
    <body>
        <h1>Hello World. 0501</h1>
        <p>
            <a href="">主連結</a>
        </p>

        <p>
            這是一個段落
        </p>
        <p>
            <ul>
                <li>條列1</li>
                <li>條列2</li>
                <li>條列3</li>
            </ul>
        </p>
        <p>
            <a href="test.html">連結1</a><br>
            <a href="">連結2</a><br>
        </p>
        <section>
            <p>
                <a href="">section a tag </a>
            </p>
        </section>
    </body>
</html>
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>我的網頁</title>
        <style>
           p::before {content: "♥";} /*虛擬元素*/
           p::after {   /*虛擬元素*/
            content:"(海明威)";
            color: blue;
         }
        </style>
    </head>
    <body>
     <p>世界是個美好的地方,值得我們未奮鬥。</p>
    </body>
</html>
