<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>問題回饋表單</title>
</head>

<body>
<form>
<label>姓名：</label>
<input type="text" name="name"><br><br>

<label>電子郵件：</label>
<input type="email" name="email"><br><br>

<label>問題描述：</label><br>
<textarea name="message" rows="5" cols="40"></textarea><br><br>

<label>問題分類：</label>
<select name="type">
<option>登入問題</option>
<option>系統錯誤</option>
<option>意見回饋</option>
<option>其他</option>
</select><br><br>

<button type="submit">提交</button>
<button type="reset">重設</button>
</form>
</body>
</html>
